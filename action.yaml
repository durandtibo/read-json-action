name: "read-json-file"
description: |
  Read and validate JSON files with automatic compatibility checking for your Python version

author: "Thibaut Durand"
branding:
  icon: "file-text"
  color: "blue"

inputs:
  file-path:
    description: |
      Path to the JSON file relative to the repository root
      (e.g., "config.json", "data/settings.json")
    required: true
  fail-on-invalid-json:
    description: |
      Whether to fail if the file contains invalid JSON. When false, the action will succeed
      but is-valid-json will be false
    required: false
    default: "true"

outputs:
  json-content:
    description: |
      The complete JSON content as a string. Use fromJSON() to parse it in subsequent steps
    value: ${{ steps.read-file.outputs.json-content }}
  file-exists:
    description: "Boolean indicating whether the file exists"
    value: ${{ steps.check-file.outputs.file-exists }}
  is-valid-json:
    description: "Boolean indicating whether the file contains valid JSON"
    value: ${{ steps.validate-json.outputs.is-valid-json }}

runs:
  using: "composite"
  steps:
    # ============================================================================
    # Step 1: Check if the file exists
    # ============================================================================
    # Verify that the specified JSON file exists in the repository.
    # The action will fail if the file is not found.
    - name: Check if file exists
      id: check-file
      shell: bash
      env:
        FILE_PATH: ${{ inputs.file-path }}
      run: |
        set -euo pipefail

        echo "🔍 Checking for file: $FILE_PATH"

        if [ -f "$FILE_PATH" ]; then
          echo "✅ File exists"
          echo "file-exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "::error::❌ File not found: $FILE_PATH"
          echo "file-exists=false" >> "$GITHUB_OUTPUT"
          exit 1
        fi

    # ============================================================================
    # Step 2: Read the file content
    # ============================================================================
    # Read the entire contents of the JSON file directly from disk. Content is
    # never interpolated into the run script itself (only passed via env/files),
    # which avoids shell/script injection from untrusted file content.
    - name: Read file content
      id: read-file
      if: steps.check-file.outputs.file-exists == 'true'
      shell: bash
      env:
        FILE_PATH: ${{ inputs.file-path }}
      run: |
        set -euo pipefail

        echo "📄 Reading file: $FILE_PATH"

        # Use a random delimiter so file content can never collide with it
        # and corrupt the GITHUB_OUTPUT file.
        RANDOM_ID="$(uuidgen 2>/dev/null || python3 -c 'import uuid; print(uuid.uuid4().hex)')"
        DELIMITER="EOF_JSON_CONTENT_${RANDOM_ID}"

        {
          echo "json-content<<$DELIMITER"
          cat "$FILE_PATH"
          echo ""
          echo "$DELIMITER"
        } >> "$GITHUB_OUTPUT"

        # Display file size for debugging
        FILE_SIZE=$(wc -c < "$FILE_PATH" | tr -d ' ')
        echo "📊 File size: $FILE_SIZE bytes"
        echo "✅ File content read successfully"

    # ============================================================================
    # Step 3: Validate JSON syntax
    # ============================================================================
    # Verify that the file contains valid JSON using Python's json module, which
    # is preinstalled on both Linux and macOS GitHub-hosted runners. Reading from
    # disk (rather than embedding content in the workflow expression) avoids
    # script injection and keeps validation independent of GitHub Actions'
    # fromJSON() quirks (e.g. its handling of large integers).
    - name: Validate JSON syntax
      id: validate-json
      if: steps.check-file.outputs.file-exists == 'true'
      shell: bash
      env:
        FILE_PATH: ${{ inputs.file-path }}
        FAIL_ON_INVALID_JSON: ${{ inputs.fail-on-invalid-json }}
      run: |
        set -euo pipefail

        echo "🔎 Validating JSON syntax..."

        ERROR_LOG="$(mktemp)"
        trap 'rm -f "$ERROR_LOG"' EXIT

        PY_CHECK='import json, sys; json.load(open(sys.argv[1]))'
        if python3 -c "$PY_CHECK" "$FILE_PATH" 2>"$ERROR_LOG"; then
          echo "✅ Valid JSON"
          echo "is-valid-json=true" >> "$GITHUB_OUTPUT"
        else
          echo "⚠️ Invalid JSON"
          sed -e 's/^/::warning::/' "$ERROR_LOG" || true
          echo "is-valid-json=false" >> "$GITHUB_OUTPUT"

          if [ "$FAIL_ON_INVALID_JSON" = "true" ]; then
            echo "::error::❌ File contains invalid JSON: $FILE_PATH"
            exit 1
          fi
        fi

    # ============================================================================
    # Step 4: Display summary
    # ============================================================================
    # Provide a summary of what was read for easy debugging in workflow logs.
    # Shows a preview of the JSON content (first 200 characters).
    - name: Display summary
      if: steps.check-file.outputs.file-exists == 'true'
      shell: bash
      env:
        FILE_PATH: ${{ inputs.file-path }}
        FILE_EXISTS: ${{ steps.check-file.outputs.file-exists }}
        IS_VALID_JSON: ${{ steps.validate-json.outputs.is-valid-json }}
      run: |
        set -euo pipefail

        echo "📋 Summary:"
        echo "  📁 File: $FILE_PATH"
        echo "  ✓ Exists: $FILE_EXISTS"
        echo "  ✓ Valid JSON: $IS_VALID_JSON"

        # Show a preview of the content (first 200 characters), read directly
        # from disk to avoid shell interpretation of the file content.
        echo ""
        echo "📄 Content preview (first 200 chars):"
        head -c 200 "$FILE_PATH"
        echo "..."
