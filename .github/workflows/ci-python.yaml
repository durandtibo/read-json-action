# Unit tests (level 1) of scripts/validate-json.py, the only code of the action outside
# action.yaml. They need only the Python standard library and run (make test) on every OS of the
# shared matrix and on every standard Python version of the shared list, without GitHub and
# without the action.

name: Python Tests
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      test-matrix:
        description: "JSON test matrix (leave empty to load the shared one)"
        required: false
        type: string

permissions: {}

jobs:
  get-matrix:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test-matrix == '' }}
    uses: ./.github/workflows/lib-get-test-matrix.yaml
    permissions:
      contents: read

  test:
    needs: get-matrix
    if: ${{ !cancelled() && (needs.get-matrix.result == 'success' || needs.get-matrix.result == 'skipped') }}
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix || needs.get-matrix.outputs.test_matrix).os_matrix }}
        python-version: ${{ fromJson(inputs.test-matrix || needs.get-matrix.outputs.test_matrix).python_versions_standard }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the unit tests
        run: |
          make test
