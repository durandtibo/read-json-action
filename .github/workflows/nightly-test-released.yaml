# Workflow testing the latest released action (pinned by SHA below) on multiple operating
# systems and Python versions, to catch regressions in what consumers pick up. It mirrors the
# tests of ci-action.yaml, which tests the current checkout instead: keep both in sync. Update
# the pinned release below when a new version is released.

name: Test Released Action
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}
        python-version: ${{ fromJson(inputs.test-matrix).python_versions_standard }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # -----------------------------------------------------------------------
      # Valid JSON: shapes and content
      # -----------------------------------------------------------------------
      - name: 🧪 Test single-line JSON
        id: test-single
        uses: durandtibo/read-json-action@b014656c6f0c53b3caf9056fedeaead02ebae3ad # ratchet:durandtibo/read-json-action@v0.1
        with:
          file-path: test-data/single-line.json

      - name: ✓ Verify single-line JSON
        env:
          FILE_EXISTS: ${{ steps.test-single.outputs.file-exists }}
          IS_VALID: ${{ steps.test-single.outputs.is-valid-json }}
          CONTENT: ${{ steps.test-single.outputs.json-content }}
          NAME: ${{ fromJSON(steps.test-single.outputs.json-content).name }}
          VERSION: ${{ fromJSON(steps.test-single.outputs.json-content).version }}
          ACTIVE: ${{ fromJSON(steps.test-single.outputs.json-content).active }}
        run: |
          set -euo pipefail
          source scripts/test-helper.sh

          display_outputs "$FILE_EXISTS" "$IS_VALID" "$CONTENT" "true"
          test_single_line_json "$FILE_EXISTS" "$IS_VALID" "$NAME" "$VERSION" "$ACTIVE"
          verify_content_matches_file test-data/single-line.json CONTENT

      - name: 🧪 Test multi-line JSON
        id: test-multi
        uses: durandtibo/read-json-action@b014656c6f0c53b3caf9056fedeaead02ebae3ad # ratchet:durandtibo/read-json-action@v0.1
        with:
          file-path: test-data/multi-line.json

      - name: ✓ Verify multi-line JSON
        env:
          FILE_EXISTS: ${{ steps.test-multi.outputs.file-exists }}
          IS_VALID: ${{ steps.test-multi.outputs.is-valid-json }}
          CONTENT: ${{ steps.test-multi.outputs.json-content }}
          NAME: ${{ fromJSON(steps.test-multi.outputs.json-content).name }}
          DEBUG: ${{ fromJSON(steps.test-multi.outputs.json-content).config.debug }}
          TIMEOUT: ${{ fromJSON(steps.test-multi.outputs.json-content).config.timeout }}
        run: |
          set -euo pipefail
          source scripts/test-helper.sh

          display_outputs "$FILE_EXISTS" "$IS_VALID"
          test_multi_line_json "$FILE_EXISTS" "$IS_VALID" "$NAME" "$DEBUG" "$TIMEOUT"
          verify_content_matches_file test-data/multi-line.json CONTENT

      - name: 🧪 Test nested JSON
        id: test-nested
        uses: durandtibo/read-json-action@b014656c6f0c53b3caf9056fedeaead02ebae3ad # ratchet:durandtibo/read-json-action@v0.1
        with:
          file-path: test-data/nested.json

      - name: ✓ Verify nested JSON
        env:
          FILE_EXISTS: ${{ steps.test-nested.outputs.file-exists }}
          IS_VALID: ${{ steps.test-nested.outputs.is-valid-json }}
          CONTENT: ${{ steps.test-nested.outputs.json-content }}
          AUTHOR: ${{ fromJSON(steps.test-nested.outputs.json-content).metadata.author }}
          DEV_URL: ${{ fromJSON(steps.test-nested.outputs.json-content).environments.dev.url }}
          PROD_PORT: ${{ fromJSON(steps.test-nested.outputs.json-content).environments.prod.port }}
          THIRD_OS: ${{ fromJSON(steps.test-nested.outputs.json-content).matrix[2].os }}
        run: |
          set -euo pipefail
          source scripts/test-helper.sh

          test_nested_json "$FILE_EXISTS" "$IS_VALID" "$AUTHOR" "$DEV_URL" "$PROD_PORT"
          verify_json_value "matrix[2].os" "macos-latest" "$THIRD_OS"
          verify_content_matches_file test-data/nested.json CONTENT

      - name: 🧪 Test JSON with special characters
        id: test-special
        uses: durandtibo/read-json-action@b014656c6f0c53b3caf9056fedeaead02ebae3ad # ratchet:durandtibo/read-json-action@v0.1
        with:
          file-path: test-data/special-chars.json

      - name: ✓ Verify special characters
        env:
          FILE_EXISTS: ${{ steps.test-special.outputs.file-exists }}
          IS_VALID: ${{ steps.test-special.outputs.is-valid-json }}
          CONTENT: ${{ steps.test-special.outputs.json-content }}
          MESSAGE: ${{ fromJSON(steps.test-special.outputs.json-content).message }}
          NEWLINE: ${{ fromJSON(steps.test-special.outputs.json-content).newline }}
          UNICODE: ${{ fromJSON(steps.test-special.outputs.json-content).unicode }}
        run: |
          set -euo pipefail
          source scripts/test-helper.sh

          run_basic_validation "$FILE_EXISTS" "$IS_VALID"
          verify_json_value "message" 'Hello "World"!' "$MESSAGE"
          verify_json_value "newline" $'Line 1\nLine 2' "$NEWLINE"
          verify_json_value "unicode" "Emoji 🚀 and symbols © ® ™" "$UNICODE"
          verify_content_matches_file test-data/special-chars.json CONTENT
          print_success "Special characters test passed"

      - name: 🧪 Test empty JSON object
        id: test-empty
        uses: durandtibo/read-json-action@b014656c6f0c53b3caf9056fedeaead02ebae3ad # ratchet:durandtibo/read-json-action@v0.1
        with:
          file-path: test-data/empty.json

      - name: ✓ Verify empty JSON object
        env:
          FILE_EXISTS: ${{ steps.test-empty.outputs.file-exists }}
          IS_VALID: ${{ steps.test-empty.outputs.is-valid-json }}
          CONTENT: ${{ steps.test-empty.outputs.json-content }}
        run: |
          set -euo pipefail
          source scripts/test-helper.sh

          run_basic_validation "$FILE_EXISTS" "$IS_VALID"
          verify_content_matches_file "test-data/empty.json" CONTENT
          verify_json_value "content" "{}" "$(echo "$CONTENT" | tr -d "[:space:]")"

      - name: 🧪 Test empty JSON array
        id: test-array-empty
        uses: durandtibo/read-json-action@b014656c6f0c53b3caf9056fedeaead02ebae3ad # ratchet:durandtibo/read-json-action@v0.1
        with:
          file-path: test-data/empty-array.json

      - name: ✓ Verify empty JSON array
        env:
          FILE_EXISTS: ${{ steps.test-array-empty.outputs.file-exists }}
          IS_VALID: ${{ steps.test-array-empty.outputs.is-valid-json }}
          CONTENT: ${{ steps.test-array-empty.outputs.json-content }}
        run: |
          set -euo pipefail
          source scripts/test-helper.sh

          run_basic_validation "$FILE_EXISTS" "$IS_VALID"
          verify_content_matches_file "test-data/empty-array.json" CONTENT
          verify_json_value "content" "[]" "$(echo "$CONTENT" | tr -d "[:space:]")"

      - name: 🧪 Test top-level JSON array
        id: test-array
        uses: durandtibo/read-json-action@b014656c6f0c53b3caf9056fedeaead02ebae3ad # ratchet:durandtibo/read-json-action@v0.1
        with:
          file-path: test-data/array.json

      - name: ✓ Verify top-level JSON array
        env:
          FILE_EXISTS: ${{ steps.test-array.outputs.file-exists }}
          IS_VALID: ${{ steps.test-array.outputs.is-valid-json }}
          CONTENT: ${{ steps.test-array.outputs.json-content }}
        run: |
          set -euo pipefail
          source scripts/test-helper.sh

          run_basic_validation "$FILE_EXISTS" "$IS_VALID"
          verify_content_matches_file "test-data/array.json" CONTENT

      - name: 🧪 Test top-level JSON string
        id: test-scalar-string
        uses: durandtibo/read-json-action@b014656c6f0c53b3caf9056fedeaead02ebae3ad # ratchet:durandtibo/read-json-action@v0.1
        with:
          file-path: test-data/scalar-string.json

      - name: ✓ Verify top-level JSON string
        env:
          FILE_EXISTS: ${{ steps.test-scalar-string.outputs.file-exists }}
          IS_VALID: ${{ steps.test-scalar-string.outputs.is-valid-json }}
          CONTENT: ${{ steps.test-scalar-string.outputs.json-content }}
        run: |
          set -euo pipefail
          source scripts/test-helper.sh

          run_basic_validation "$FILE_EXISTS" "$IS_VALID"
          verify_content_matches_file "test-data/scalar-string.json" CONTENT

      - name: 🧪 Test top-level JSON number
        id: test-scalar-number
        uses: durandtibo/read-json-action@b014656c6f0c53b3caf9056fedeaead02ebae3ad # ratchet:durandtibo/read-json-action@v0.1
        with:
          file-path: test-data/scalar-number.json

      - name: ✓ Verify top-level JSON number
        env:
          FILE_EXISTS: ${{ steps.test-scalar-number.outputs.file-exists }}
          IS_VALID: ${{ steps.test-scalar-number.outputs.is-valid-json }}
          CONTENT: ${{ steps.test-scalar-number.outputs.json-content }}
        run: |
          set -euo pipefail
          source scripts/test-helper.sh

          run_basic_validation "$FILE_EXISTS" "$IS_VALID"
          verify_content_matches_file "test-data/scalar-number.json" CONTENT

      - name: 🧪 Test top-level JSON null
        id: test-scalar-null
        uses: durandtibo/read-json-action@b014656c6f0c53b3caf9056fedeaead02ebae3ad # ratchet:durandtibo/read-json-action@v0.1
        with:
          file-path: test-data/scalar-null.json

      - name: ✓ Verify top-level JSON null
        env:
          FILE_EXISTS: ${{ steps.test-scalar-null.outputs.file-exists }}
          IS_VALID: ${{ steps.test-scalar-null.outputs.is-valid-json }}
          CONTENT: ${{ steps.test-scalar-null.outputs.json-content }}
        run: |
          set -euo pipefail
          source scripts/test-helper.sh

          run_basic_validation "$FILE_EXISTS" "$IS_VALID"
          verify_content_matches_file "test-data/scalar-null.json" CONTENT

      - name: 🧪 Test JSON with very large numbers
        id: test-large-numbers
        uses: durandtibo/read-json-action@b014656c6f0c53b3caf9056fedeaead02ebae3ad # ratchet:durandtibo/read-json-action@v0.1
        with:
          file-path: test-data/large-numbers.json

      - name: ✓ Verify JSON with very large numbers
        env:
          FILE_EXISTS: ${{ steps.test-large-numbers.outputs.file-exists }}
          IS_VALID: ${{ steps.test-large-numbers.outputs.is-valid-json }}
          CONTENT: ${{ steps.test-large-numbers.outputs.json-content }}
        run: |
          set -euo pipefail
          source scripts/test-helper.sh

          run_basic_validation "$FILE_EXISTS" "$IS_VALID"
          verify_content_matches_file "test-data/large-numbers.json" CONTENT
          # Numbers must be preserved textually, not rounded by the action
          grep -q "12345678901234567890123" <<<"$CONTENT"
          grep -q "9007199254740993" <<<"$CONTENT"

      - name: 🧪 Test JSON without trailing newline
        id: test-no-newline
        uses: durandtibo/read-json-action@b014656c6f0c53b3caf9056fedeaead02ebae3ad # ratchet:durandtibo/read-json-action@v0.1
        with:
          file-path: test-data/no-trailing-newline.json

      - name: ✓ Verify JSON without trailing newline
        env:
          FILE_EXISTS: ${{ steps.test-no-newline.outputs.file-exists }}
          IS_VALID: ${{ steps.test-no-newline.outputs.is-valid-json }}
          CONTENT: ${{ steps.test-no-newline.outputs.json-content }}
        run: |
          set -euo pipefail
          source scripts/test-helper.sh

          run_basic_validation "$FILE_EXISTS" "$IS_VALID"
          verify_content_matches_file "test-data/no-trailing-newline.json" CONTENT

      - name: 🧪 Test path containing spaces
        id: test-spaces
        uses: durandtibo/read-json-action@b014656c6f0c53b3caf9056fedeaead02ebae3ad # ratchet:durandtibo/read-json-action@v0.1
        with:
          file-path: test-data/dir with spaces/file name.json

      - name: ✓ Verify path containing spaces
        env:
          FILE_EXISTS: ${{ steps.test-spaces.outputs.file-exists }}
          IS_VALID: ${{ steps.test-spaces.outputs.is-valid-json }}
          CONTENT: ${{ steps.test-spaces.outputs.json-content }}
        run: |
          set -euo pipefail
          source scripts/test-helper.sh

          run_basic_validation "$FILE_EXISTS" "$IS_VALID"
          verify_content_matches_file "test-data/dir with spaces/file name.json" CONTENT

      # -----------------------------------------------------------------------
      # Output integrity: content resembling heredoc delimiters / workflow commands
      # -----------------------------------------------------------------------
      - name: 🧪 Test JSON resembling output delimiters and workflow commands
        id: test-delimiter
        uses: durandtibo/read-json-action@b014656c6f0c53b3caf9056fedeaead02ebae3ad # ratchet:durandtibo/read-json-action@v0.1
        with:
          file-path: test-data/delimiter-collision.json

      - name: ✓ Verify JSON resembling output delimiters and workflow commands
        env:
          FILE_EXISTS: ${{ steps.test-delimiter.outputs.file-exists }}
          IS_VALID: ${{ steps.test-delimiter.outputs.is-valid-json }}
          CONTENT: ${{ steps.test-delimiter.outputs.json-content }}
        run: |
          set -euo pipefail
          source scripts/test-helper.sh

          run_basic_validation "$FILE_EXISTS" "$IS_VALID"
          verify_content_matches_file "test-data/delimiter-collision.json" CONTENT
          verify_output_exists "json-content" "$CONTENT"

      # -----------------------------------------------------------------------
      # Injection safety
      # -----------------------------------------------------------------------
      - name: 🧪 Test shell/script injection safety
        id: test-injection
        uses: durandtibo/read-json-action@b014656c6f0c53b3caf9056fedeaead02ebae3ad # ratchet:durandtibo/read-json-action@v0.1
        with:
          file-path: test-data/injection-attempt.json

      - name: ✓ Verify shell/script injection safety
        env:
          FILE_EXISTS: ${{ steps.test-injection.outputs.file-exists }}
          IS_VALID: ${{ steps.test-injection.outputs.is-valid-json }}
          CONTENT: ${{ steps.test-injection.outputs.json-content }}
          PAYLOAD: ${{ fromJSON(steps.test-injection.outputs.json-content).payload }}
        run: |
          set -euo pipefail
          source scripts/test-helper.sh

          run_basic_validation "$FILE_EXISTS" "$IS_VALID"
          verify_content_matches_file test-data/injection-attempt.json CONTENT

          EXPECTED_PAYLOAD="$(python3 -I -c "
          import json
          print(json.load(open('test-data/injection-attempt.json'))['payload'])
          ")"

          verify_no_injection "payload" "$EXPECTED_PAYLOAD" "$PAYLOAD"

      - name: 🧪 Test shell metacharacters in file-path input
        id: test-path-injection
        uses: durandtibo/read-json-action@b014656c6f0c53b3caf9056fedeaead02ebae3ad # ratchet:durandtibo/read-json-action@v0.1
        with:
          file-path: "test-data/x$(touch injected-by-path).json"
        continue-on-error: true

      - name: ✓ Verify file-path input is never executed
        env:
          OUTCOME: ${{ steps.test-path-injection.outcome }}
          FILE_EXISTS: ${{ steps.test-path-injection.outputs.file-exists }}
        run: |
          set -euo pipefail
          source scripts/test-helper.sh

          verify_step_outcome "Shell metacharacters in file-path" "failure" "$OUTCOME"
          verify_json_value "file-exists" "false" "$FILE_EXISTS"
          verify_path_absent "injected-by-path"
          verify_path_absent "test-data/injected-by-path"

      # -----------------------------------------------------------------------
      # Invalid / empty files, fail-on-invalid-json=false (must NOT fail)
      # -----------------------------------------------------------------------
      - name: 🧪 Test invalid JSON, fail-on-invalid-json=false
        id: tol-invalid
        uses: durandtibo/read-json-action@b014656c6f0c53b3caf9056fedeaead02ebae3ad # ratchet:durandtibo/read-json-action@v0.1
        with:
          file-path: test-data/invalid.json
          fail-on-invalid-json: false

      - name: ✓ Verify invalid JSON is reported without failing
        env:
          OUTCOME: ${{ steps.tol-invalid.outcome }}
          FILE_EXISTS: ${{ steps.tol-invalid.outputs.file-exists }}
          IS_VALID: ${{ steps.tol-invalid.outputs.is-valid-json }}
          CONTENT: ${{ steps.tol-invalid.outputs.json-content }}
        run: |
          set -euo pipefail
          source scripts/test-helper.sh

          verify_step_outcome "invalid JSON" "success" "$OUTCOME"
          verify_file_exists "$FILE_EXISTS"
          verify_json_value "is-valid-json" "false" "$IS_VALID"
          verify_raw_content_matches_file test-data/invalid.json CONTENT

      - name: 🧪 Test empty (0 byte) file, fail-on-invalid-json=false
        id: tol-empty-file
        uses: durandtibo/read-json-action@b014656c6f0c53b3caf9056fedeaead02ebae3ad # ratchet:durandtibo/read-json-action@v0.1
        with:
          file-path: test-data/empty-file.json
          fail-on-invalid-json: false

      - name: ✓ Verify empty (0 byte) file is reported without failing
        env:
          OUTCOME: ${{ steps.tol-empty-file.outcome }}
          FILE_EXISTS: ${{ steps.tol-empty-file.outputs.file-exists }}
          IS_VALID: ${{ steps.tol-empty-file.outputs.is-valid-json }}
          CONTENT: ${{ steps.tol-empty-file.outputs.json-content }}
        run: |
          set -euo pipefail
          source scripts/test-helper.sh

          verify_step_outcome "empty (0 byte) file" "success" "$OUTCOME"
          verify_file_exists "$FILE_EXISTS"
          verify_json_value "is-valid-json" "false" "$IS_VALID"
          verify_raw_content_matches_file test-data/empty-file.json CONTENT

      - name: 🧪 Test whitespace-only file, fail-on-invalid-json=false
        id: tol-whitespace
        uses: durandtibo/read-json-action@b014656c6f0c53b3caf9056fedeaead02ebae3ad # ratchet:durandtibo/read-json-action@v0.1
        with:
          file-path: test-data/whitespace-only.json
          fail-on-invalid-json: false

      - name: ✓ Verify whitespace-only file is reported without failing
        env:
          OUTCOME: ${{ steps.tol-whitespace.outcome }}
          FILE_EXISTS: ${{ steps.tol-whitespace.outputs.file-exists }}
          IS_VALID: ${{ steps.tol-whitespace.outputs.is-valid-json }}
          CONTENT: ${{ steps.tol-whitespace.outputs.json-content }}
        run: |
          set -euo pipefail
          source scripts/test-helper.sh

          verify_step_outcome "whitespace-only file" "success" "$OUTCOME"
          verify_file_exists "$FILE_EXISTS"
          verify_json_value "is-valid-json" "false" "$IS_VALID"
          verify_raw_content_matches_file test-data/whitespace-only.json CONTENT

      - name: 🧪 Test trailing comma, fail-on-invalid-json=false
        id: tol-trailing-comma
        uses: durandtibo/read-json-action@b014656c6f0c53b3caf9056fedeaead02ebae3ad # ratchet:durandtibo/read-json-action@v0.1
        with:
          file-path: test-data/trailing-comma.json
          fail-on-invalid-json: false

      - name: ✓ Verify trailing comma is reported without failing
        env:
          OUTCOME: ${{ steps.tol-trailing-comma.outcome }}
          FILE_EXISTS: ${{ steps.tol-trailing-comma.outputs.file-exists }}
          IS_VALID: ${{ steps.tol-trailing-comma.outputs.is-valid-json }}
          CONTENT: ${{ steps.tol-trailing-comma.outputs.json-content }}
        run: |
          set -euo pipefail
          source scripts/test-helper.sh

          verify_step_outcome "trailing comma" "success" "$OUTCOME"
          verify_file_exists "$FILE_EXISTS"
          verify_json_value "is-valid-json" "false" "$IS_VALID"
          verify_raw_content_matches_file test-data/trailing-comma.json CONTENT

      - name: 🧪 Test single-quoted JSON, fail-on-invalid-json=false
        id: tol-single-quotes
        uses: durandtibo/read-json-action@b014656c6f0c53b3caf9056fedeaead02ebae3ad # ratchet:durandtibo/read-json-action@v0.1
        with:
          file-path: test-data/single-quotes.json
          fail-on-invalid-json: false

      - name: ✓ Verify single-quoted JSON is reported without failing
        env:
          OUTCOME: ${{ steps.tol-single-quotes.outcome }}
          FILE_EXISTS: ${{ steps.tol-single-quotes.outputs.file-exists }}
          IS_VALID: ${{ steps.tol-single-quotes.outputs.is-valid-json }}
          CONTENT: ${{ steps.tol-single-quotes.outputs.json-content }}
        run: |
          set -euo pipefail
          source scripts/test-helper.sh

          verify_step_outcome "single-quoted JSON" "success" "$OUTCOME"
          verify_file_exists "$FILE_EXISTS"
          verify_json_value "is-valid-json" "false" "$IS_VALID"
          verify_raw_content_matches_file test-data/single-quotes.json CONTENT

      - name: 🧪 Test truncated JSON, fail-on-invalid-json=false
        id: tol-truncated
        uses: durandtibo/read-json-action@b014656c6f0c53b3caf9056fedeaead02ebae3ad # ratchet:durandtibo/read-json-action@v0.1
        with:
          file-path: test-data/truncated.json
          fail-on-invalid-json: false

      - name: ✓ Verify truncated JSON is reported without failing
        env:
          OUTCOME: ${{ steps.tol-truncated.outcome }}
          FILE_EXISTS: ${{ steps.tol-truncated.outputs.file-exists }}
          IS_VALID: ${{ steps.tol-truncated.outputs.is-valid-json }}
          CONTENT: ${{ steps.tol-truncated.outputs.json-content }}
        run: |
          set -euo pipefail
          source scripts/test-helper.sh

          verify_step_outcome "truncated JSON" "success" "$OUTCOME"
          verify_file_exists "$FILE_EXISTS"
          verify_json_value "is-valid-json" "false" "$IS_VALID"
          verify_raw_content_matches_file test-data/truncated.json CONTENT

      - name: 🧪 Test multiple JSON documents, fail-on-invalid-json=false
        id: tol-trailing-data
        uses: durandtibo/read-json-action@b014656c6f0c53b3caf9056fedeaead02ebae3ad # ratchet:durandtibo/read-json-action@v0.1
        with:
          file-path: test-data/trailing-data.json
          fail-on-invalid-json: false

      - name: ✓ Verify multiple JSON documents is reported without failing
        env:
          OUTCOME: ${{ steps.tol-trailing-data.outcome }}
          FILE_EXISTS: ${{ steps.tol-trailing-data.outputs.file-exists }}
          IS_VALID: ${{ steps.tol-trailing-data.outputs.is-valid-json }}
          CONTENT: ${{ steps.tol-trailing-data.outputs.json-content }}
        run: |
          set -euo pipefail
          source scripts/test-helper.sh

          verify_step_outcome "multiple JSON documents" "success" "$OUTCOME"
          verify_file_exists "$FILE_EXISTS"
          verify_json_value "is-valid-json" "false" "$IS_VALID"
          verify_raw_content_matches_file test-data/trailing-data.json CONTENT

      # -----------------------------------------------------------------------
      # Invalid / empty files, fail-on-invalid-json=true (default or explicit): must fail
      # -----------------------------------------------------------------------
      - name: 🧪 Test invalid JSON with default input (should fail)
        id: strict-default
        uses: durandtibo/read-json-action@b014656c6f0c53b3caf9056fedeaead02ebae3ad # ratchet:durandtibo/read-json-action@v0.1
        with:
          file-path: test-data/invalid.json
        continue-on-error: true

      - name: ✓ Verify invalid JSON with default input fails the step
        env:
          OUTCOME: ${{ steps.strict-default.outcome }}
          IS_VALID: ${{ steps.strict-default.outputs.is-valid-json }}
        run: |
          set -euo pipefail
          source scripts/test-helper.sh

          verify_step_outcome "invalid JSON with default input" "failure" "$OUTCOME"
          verify_json_value "is-valid-json" "false" "$IS_VALID"

      - name: 🧪 Test invalid JSON with explicit true (should fail)
        id: strict-explicit
