# Nightly workflow testing the latest released action, to catch regressions in
# what consumers pick up. It calls ci-action.yaml with use-released: true, so the
# released action runs exactly the same cases as the code of this checkout, which
# ci.yaml tests (also nightly). The released version is pinned by SHA in
# ci-action.yaml only.
#
# Permissions are set at the job level, not the workflow level.

name: Nightly Tests
on:
  schedule:
    - cron: "30 10 * * *" # run at 10:30 AM UTC
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  # Load the shared Python-version and OS matrices from the default config of
  # durandtibo/workflow-config-action once.
  get-matrix:
    uses: ./.github/workflows/lib-get-test-matrix.yaml
    permissions:
      contents: read

  # Test the latest released action
  test-released:
    needs: get-matrix
    uses: ./.github/workflows/ci-action.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
      use-released: true
    permissions:
      actions: read
      checks: read
      contents: read
