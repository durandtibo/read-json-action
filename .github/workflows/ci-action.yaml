# Workflow testing the action on the cases listed in test-data/cases.json. By
# default it runs the action from this checkout (uses: ./), i.e. the version
# that is not released yet. With use-released: true it runs the released
# action, pinned by SHA below, on the very same cases (see nightly.yaml). The
# pinned SHA lives only in this file.
#
# Jobs:
#   get-cases       reads test-data/cases.json
#   cases           one job per case and per runner of the shared OS matrix. Generated
#                   fixtures are created first by scripts/setup-fixtures.sh
#   python-compat   cases flagged "python-compat" on every runner of the shared OS matrix,
#                   with the oldest and newest Python of the shared Python list
#   fromjson-compat valid fixtures must parse with fromJSON()
#   log-injection   file content must never create annotations (log injection)
#
# To add a test: add a fixture to test-data/ and a case to test-data/cases.json.
# Outputs are always passed to verification scripts through env, never
# interpolated into the script.

name: Test Action
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string
      use-released:
        description: "Test the released action (pinned by SHA) instead of the code of this checkout"
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  # Read the case list once. It is the single source of truth for the tests.
  get-cases:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    timeout-minutes: 2
    outputs:
      cases: ${{ steps.load.outputs.cases }}
      compat-cases: ${{ steps.load.outputs.compat-cases }}
      python-versions: ${{ steps.load.outputs.python-versions }}
      valid-cases: ${{ steps.load.outputs.valid-cases }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Load cases
        id: load
        env:
          TEST_MATRIX: ${{ inputs.test-matrix }}
        run: |
          set -euo pipefail

          cases="$(jq -c '.' test-data/cases.json)"
          {
            echo "cases=$cases"
            echo "compat-cases=$(jq -c '[.[] | select(."python-compat" == true)]' test-data/cases.json)"
            echo "valid-cases=$(jq -c '[.[] | select(."expect-valid" == "true" and ."skip-fromjson" != true)]' test-data/cases.json)"
            # Oldest and newest Python of the standard list.
            echo "python-versions=$(jq -c '.python_versions_standard | sort_by(split(".") | map(tonumber)) | [first, last]' <<<"$TEST_MATRIX")"
          } >> "$GITHUB_OUTPUT"
          echo "Loaded $(jq 'length' <<<"$cases") cases"

  cases:
    needs: get-cases
    name: ${{ matrix.case.id }} (${{ matrix.os }})
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}
        case: ${{ fromJson(needs.get-cases.outputs.cases) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      # Fixtures that cannot be committed (over-size, unreadable, a file named "-n").
      - name: Create generated fixtures
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/setup-fixtures.sh

      - name: 🧪 Run the action (this checkout)
        id: local
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          file-path: ${{ matrix.case['file-path'] }}
          fail-on-error: ${{ matrix.case['fail-on-error'] || 'true' }}
        continue-on-error: true
        env:
          LC_ALL: ${{ matrix.case['lc-all'] }}

      - name: 🧪 Run the action (released)
        id: released
        if: ${{ inputs.use-released }}
        uses: durandtibo/read-json-action@b014656c6f0c53b3caf9056fedeaead02ebae3ad # ratchet:durandtibo/read-json-action@v0.1
        with:
          file-path: ${{ matrix.case['file-path'] }}
          fail-on-error: ${{ matrix.case['fail-on-error'] || 'true' }}
        continue-on-error: true
        env:
          LC_ALL: ${{ matrix.case['lc-all'] }}

      - name: ✓ Verify the case
        env:
          CASE_ID: ${{ matrix.case.id }}
          FILE_PATH: ${{ matrix.case['file-path'] }}
          EXPECT_OUTCOME: ${{ matrix.case['expect-outcome'] }}
          EXPECT_VALID: ${{ matrix.case['expect-valid'] }}
          OUTCOME: ${{ inputs.use-released && steps.released.outcome || steps.local.outcome }}
          IS_VALID: ${{ steps.local.outputs.is-valid-json || steps.released.outputs.is-valid-json }}
          CONTENT: ${{ steps.local.outputs.json-content || steps.released.outputs.json-content }}
        run: |
          set -euo pipefail
          source scripts/test-helper.sh

          verify_case

  # The Python version barely affects the action (it only needs the json
  # module), so it is not a dimension of the main matrix.
  python-compat:
    needs: get-cases
    name: ${{ matrix.case.id }} (${{ matrix.os }}, Python ${{ matrix.python-version }})
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}
        python-version: ${{ fromJson(needs.get-cases.outputs.python-versions) }}
        case: ${{ fromJson(needs.get-cases.outputs.compat-cases) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: 🧪 Run the action (this checkout)
        id: local
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          file-path: ${{ matrix.case['file-path'] }}
          fail-on-error: ${{ matrix.case['fail-on-error'] || 'true' }}
        continue-on-error: true

      - name: 🧪 Run the action (released)
        id: released
        if: ${{ inputs.use-released }}
        uses: durandtibo/read-json-action@b014656c6f0c53b3caf9056fedeaead02ebae3ad # ratchet:durandtibo/read-json-action@v0.1
        with:
          file-path: ${{ matrix.case['file-path'] }}
          fail-on-error: ${{ matrix.case['fail-on-error'] || 'true' }}
        continue-on-error: true

      - name: ✓ Verify the case
        env:
          CASE_ID: ${{ matrix.case.id }}
          FILE_PATH: ${{ matrix.case['file-path'] }}
          EXPECT_OUTCOME: ${{ matrix.case['expect-outcome'] }}
          EXPECT_VALID: ${{ matrix.case['expect-valid'] }}
          OUTCOME: ${{ inputs.use-released && steps.released.outcome || steps.local.outcome }}
          IS_VALID: ${{ steps.local.outputs.is-valid-json || steps.released.outputs.is-valid-json }}
          CONTENT: ${{ steps.local.outputs.json-content || steps.released.outputs.json-content }}
        run: |
          set -euo pipefail
          source scripts/test-helper.sh

          verify_case

  # The content of every valid fixture must be accepted by fromJSON(), and
  # must parse to the same value as the file. Workflow expressions run the same
  # everywhere, so one runner is enough. Cases with "skip-fromjson" (integers
  # beyond double precision) are left out: fromJSON() rounds them by design.
  fromjson-compat:
    needs: get-cases
    name: fromJSON ${{ matrix.case.id }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        case: ${{ fromJson(needs.get-cases.outputs.valid-cases) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: 🧪 Run the action (this checkout)
        id: local
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          file-path: ${{ matrix.case['file-path'] }}

      - name: 🧪 Run the action (released)
        id: released
        if: ${{ inputs.use-released }}
        uses: durandtibo/read-json-action@b014656c6f0c53b3caf9056fedeaead02ebae3ad # ratchet:durandtibo/read-json-action@v0.1
        with:
          file-path: ${{ matrix.case['file-path'] }}

      - name: ✓ Verify fromJSON() accepts the content
        env:
          FILE_PATH: ${{ matrix.case['file-path'] }}
          PARSED: ${{ toJSON(fromJSON(steps.local.outputs.json-content || steps.released.outputs.json-content)) }}
        run: |
          set -euo pipefail
          source scripts/test-helper.sh

          verify_json_matches_file "$FILE_PATH" PARSED

  # Annotations are created from the job log only once the job has finished, so
  # they are checked in a separate job. The fixture test-data/log-injection.json
  # holds lines that are workflow commands carrying a marker text. If the action
  # printed any part of a file, the runner would run them and create annotations
  # containing the marker.
  log-injection:
    needs: [cases, python-compat, fromjson-compat]
    if: ${{ !cancelled() }}
    permissions:
      actions: read
      checks: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ✓ Verify no annotation was forged by file content
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          marker="LOG-INJECTION-MARKER"
          found=0
          job_ids="$(gh api --paginate \
            "repos/$REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.name | contains("log-injection") | not) | .id')"
          [ -n "$job_ids" ] || {
            echo "::error::No job found for run $RUN_ID"
            exit 1
          }
          for job_id in $job_ids; do
            # The job id is also the id of its check run.
            if gh api --paginate "repos/$REPOSITORY/check-runs/$job_id/annotations" \
              --jq '.[].message' | grep -qF "$marker"; then
              echo "::error::Job $job_id has an annotation created by file content"
              found=1
            fi
          done
          [ "$found" -eq 0 ]
          echo "No annotation created by file content in $(echo "$job_ids" | wc -l | tr -d ' ') jobs"
