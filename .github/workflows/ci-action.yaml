# Workflow testing the action in a real workflow. One file tests both versions:
#   - use-released: false (default, called by ci.yaml): the action from the current checkout
#     (uses: ./), i.e. the version that is not released yet.
#   - use-released: true (called by nightly.yaml): the released action, pinned by SHA below, on the
#     very same cases, to catch regressions in what consumers pick up. The pinned SHA lives only
#     in this file (bot-pin-action.yaml updates it).
#
# The tests check the contract and the wiring (inputs, outputs, failures) on the real runners.
# The syntax check itself is tested alone in ci-python.yaml (level 1). They are split in two
# groups, both defined by the rows of test-data/cases.json:
#   - general behaviour ("general": true): the default usage and the main documented usages, on
#     every runner of the shared OS matrix (os_matrix)
#   - edge cases (all other rows): one invalid value, one unusual file or path, on one runner
#     (ubuntu-latest), or on the *-latest runners of every OS (os_latest) when the row has
#     "os-sensitive": true (file system, encoding, locale, paths)
# A new test is a new row of cases.json, not a new job. A row that expects a failure follows a
# positive run on the same runner, so that it cannot fail for the wrong reason.
#
# Jobs:
#   get-cases       reads test-data/cases.json and expands it to one matrix cell per row and runner
#   cases           one job per cell. Generated fixtures are created first by
#                   scripts/setup-fixtures.sh
#   fromjson-compat valid fixtures must parse with fromJSON()
#   log-injection   file content must never create annotations (log injection)
#
# Outputs are always passed to verification scripts through env, never
# interpolated into the script.

name: Test Action
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string
      use-released:
        description: "Test the released action (pinned by SHA) instead of the code of this checkout"
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      use-released:
        description: "Test the released action (pinned by SHA) instead of the code of this checkout"
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  # A manual run loads the shared matrix itself; a call from another workflow passes it.
  get-matrix:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/lib-get-test-matrix.yaml
    permissions:
      contents: read

  # Read the case list once. It is the single source of truth for the tests.
  get-cases:
    needs: get-matrix
    if: ${{ !cancelled() && (needs.get-matrix.result == 'success' || needs.get-matrix.result == 'skipped') }}
    permissions:
      contents: read
    runs-on: ubuntu-slim
    timeout-minutes: 2
    outputs:
      cases: ${{ steps.load.outputs.cases }}
      valid-cases: ${{ steps.load.outputs.valid-cases }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Load cases
        id: load
        env:
          TEST_MATRIX: ${{ inputs.test-matrix || needs.get-matrix.outputs.test_matrix }}
        run: |
          set -euo pipefail

          # One cell per row and runner: the general rows on every runner of os_matrix, the
          # os-sensitive rows on os_latest, the other rows on ubuntu-latest.
          cases="$(jq -c --argjson matrix "$TEST_MATRIX" '
            [.[] | . as $case
              | (if .general == true then $matrix.os_matrix
                 elif ."os-sensitive" == true then $matrix.os_latest
                 else ["ubuntu-latest"] end)[] as $os
              | {case: $case, os: $os}]' test-data/cases.json)"
          {
            echo "cases=$cases"
            echo "valid-cases=$(jq -c '[.[] | select(."expect-valid" == "true" and ."skip-fromjson" != true)]' test-data/cases.json)"
          } >> "$GITHUB_OUTPUT"
          echo "Loaded $(jq 'length' test-data/cases.json) cases, $(jq 'length' <<<"$cases") cells"

  cases:
    needs: get-cases
    name: ${{ matrix.case.id }} (${{ matrix.os }})
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.get-cases.outputs.cases) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      # Fixtures that cannot be committed (over-size, unreadable, a file named "-n").
      - name: Create generated fixtures
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/setup-fixtures.sh

      # A case that expects a failure follows a positive run on the same runner, so that it
      # cannot fail for the wrong reason (a broken runner or action).
      - name: 🧪 Positive run before a failure case (this checkout)
        if: ${{ !inputs.use-released && matrix.case['expect-outcome'] == 'failure' }}
        uses: ./
        with:
          file-path: test-data/single-line.json

      - name: 🧪 Positive run before a failure case (released)
        if: ${{ inputs.use-released && matrix.case['expect-outcome'] == 'failure' }}
        uses: durandtibo/read-json-action@844a2fda414493e79506fc7e874c18a064859885 # ratchet:durandtibo/read-json-action@v0.2.0
        with:
          file-path: test-data/single-line.json

      - name: 🧪 Run the action (this checkout)
        id: local
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          file-path: ${{ matrix.case['file-path'] }}
          fail-on-error: ${{ matrix.case['fail-on-error'] || 'true' }}
        continue-on-error: true
        env:
          LC_ALL: ${{ matrix.case['lc-all'] }}

      - name: 🧪 Run the action (released)
        id: released
        if: ${{ inputs.use-released }}
        uses: durandtibo/read-json-action@844a2fda414493e79506fc7e874c18a064859885 # ratchet:durandtibo/read-json-action@v0.2.0
        with:
          file-path: ${{ matrix.case['file-path'] }}
          fail-on-error: ${{ matrix.case['fail-on-error'] || 'true' }}
        continue-on-error: true
        env:
          LC_ALL: ${{ matrix.case['lc-all'] }}

      - name: ✓ Verify the case
        env:
          CASE_ID: ${{ matrix.case.id }}
          FILE_PATH: ${{ matrix.case['file-path'] }}
          EXPECT_OUTCOME: ${{ matrix.case['expect-outcome'] }}
          EXPECT_VALID: ${{ matrix.case['expect-valid'] }}
          OUTCOME: ${{ inputs.use-released && steps.released.outcome || steps.local.outcome }}
          IS_VALID: ${{ steps.local.outputs.is-valid-json || steps.released.outputs.is-valid-json }}
          CONTENT: ${{ steps.local.outputs.json-content || steps.released.outputs.json-content }}
        run: |
          set -euo pipefail
          source scripts/test-helper.sh

          verify_case

  # The content of every valid fixture must be accepted by fromJSON(), and
  # must parse to the same value as the file. Workflow expressions run the same
  # everywhere, so one runner is enough. Cases with "skip-fromjson" (integers
  # beyond double precision) are left out: fromJSON() rounds them by design.
  fromjson-compat:
    needs: get-cases
    name: fromJSON ${{ matrix.case.id }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        case: ${{ fromJson(needs.get-cases.outputs.valid-cases) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: 🧪 Run the action (this checkout)
        id: local
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          file-path: ${{ matrix.case['file-path'] }}

      - name: 🧪 Run the action (released)
        id: released
        if: ${{ inputs.use-released }}
        uses: durandtibo/read-json-action@844a2fda414493e79506fc7e874c18a064859885 # ratchet:durandtibo/read-json-action@v0.2.0
        with:
          file-path: ${{ matrix.case['file-path'] }}

      - name: ✓ Verify fromJSON() accepts the content
        env:
          FILE_PATH: ${{ matrix.case['file-path'] }}
          PARSED: ${{ toJSON(fromJSON(steps.local.outputs.json-content || steps.released.outputs.json-content)) }}
        run: |
          set -euo pipefail
          source scripts/test-helper.sh

          verify_json_matches_file "$FILE_PATH" PARSED

  # Annotations are created from the job log only once the job has finished, so
  # they are checked in a separate job. The fixture test-data/log-injection.json
  # holds lines that are workflow commands carrying a marker text. If the action
  # printed any part of a file, the runner would run them and create annotations
  # containing the marker.
  log-injection:
    needs: [cases, fromjson-compat]
    if: ${{ !cancelled() }}
    permissions:
      actions: read
      checks: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ✓ Verify no annotation was forged by file content
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          marker="LOG-INJECTION-MARKER"
          found=0
          job_ids="$(gh api --paginate \
            "repos/$REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.name | endswith("log-injection") | not) | .id')"
          [ -n "$job_ids" ] || {
            echo "::error::No job found for run $RUN_ID"
            exit 1
          }
          for job_id in $job_ids; do
            # The job id is also the id of its check run.
            if gh api --paginate "repos/$REPOSITORY/check-runs/$job_id/annotations" \
              --jq '.[].message' | grep -qF "$marker"; then
              echo "::error::Job $job_id has an annotation created by file content"
              found=1
            fi
          done
          [ "$found" -eq 0 ]
          echo "No annotation created by file content in $(echo "$job_ids" | wc -l | tr -d ' ') jobs"
